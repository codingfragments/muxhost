name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2604, blacksmith-6vcpu-macos-15]
        # Every feature combination a consumer can pin: core only
        # (flash, zextract), topology alone, and navigate (nav; it
        # implies topology). Feature-gated code that only builds with
        # --all-features went unnoticed once (CI red v0.3.0–v0.3.5).
        features: ["", "--features topology", "--all-features"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings

      - name: cargo test
        run: cargo test ${{ matrix.features }}
